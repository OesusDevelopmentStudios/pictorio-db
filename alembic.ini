# For developers creating migrations with the alembic command (see CONTRIBUTING.md). The server does
# not read this file; it runs the migrations itself when it starts.

[alembic]
script_location = %(here)s/src/pictorio_db/db/migrations
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///migration-dev.sqlite3
