[build-system]
requires = ["setuptools>=77"]  # 77: SPDX license expression in [project]
build-backend = "setuptools.build_meta"

[project]
name = "pictorio-db"
version = "0.1.0"
description = "Image library server for Pictorio: stores images, tags and thumbnails"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"

# Exact versions, so every installation runs the code that was tested.
dependencies = [
    "fastapi==0.162.5",  # REST API, request/response models, OpenAPI schema
    "uvicorn==0.54.0",   # ASGI server that runs the FastAPI app
    "sqlalchemy==2.1.8",  # database access (SQLite)
    "alembic==1.20.1",    # database schema migrations
    "argon2-cffi==25.1.0",  # password hashing (argon2id)
]

[project.scripts]
pictorio-db = "pictorio_db.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",  # tests
    "httpx2==2.16.0",  # required by FastAPI's TestClient
    "flake8==7.5.0",  # style check
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pictorio_db.db" = ["migrations/script.py.mako"]  # template for new migrations

[tool.pytest.ini_options]
testpaths = ["tests"]
